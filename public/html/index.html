<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{meta_titulo}}</title>
  <meta id="metaDesc" name="description" content="{{meta_description}}">
  <meta id="metaKeys" name="keywords" content="{{meta_keywords}}">
  <link rel="icon" href="{{favicon_url}}">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Tema activo (applyTheme en 02_ui_helpers.js cambia este href) -->
  <link id="theme-css" rel="stylesheet" href="{{base}}/themes/theme-01-solar-pop.css?v={{version}}">
  <link rel="stylesheet" href="{{base}}/styles.css?v={{version}}">
  <!-- Carrusel de categorías, carrito y mapa -->
  <link rel="stylesheet" href="{{base}}/extras.css?v={{version}}">
</head>
<body data-base="{{base}}" data-version="{{version}}">

  <header id="header" class="site-header sticky-top"></header>

  <!-- Slider a todo el ancho -->
  <section id="inicio"></section>

  <main>
    <section id="categorias"></section>
    <section id="ofertas" class="section"></section>
    <section id="destacado" class="spotlight"></section>
    <section id="carta" class="section"></section>
    <section id="propuesta" class="section container"></section>
    <section id="empresa" class="section section-alt"></section>
    <section id="servicios" class="section container"></section>
    <section id="clientes" class="section section-alt"></section>
    <section id="contacto" class="section container"></section>
  </main>

  <footer id="footer" class="site-footer"></footer>

  <a id="waFloat" class="wa-float" href="https://wa.me/51{{celular_informes}}" target="_blank" rel="noopener" aria-label="WhatsApp">
    <i class="bi bi-whatsapp"></i>
  </a>

  <noscript>
    <div class="alert alert-warning m-3">Activa JavaScript para ver el contenido de {{nombre_negocio}}.</div>
  </noscript>

  <!-- Datos del servidor (control.php -> Mustache) -->
  <script id="page-data" type="application/json">{{{page_data_json}}}</script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{base}}/js/01_state.js?v={{version}}"></script>
  <script src="{{base}}/js/02_ui_helpers.js?v={{version}}"></script>
  <script src="{{base}}/js/03_cards.js?v={{version}}"></script>
  <script src="{{base}}/js/04_main.js?v={{version}}"></script>
  <script src="{{base}}/js/05_extras.js?v={{version}}"></script>
</body>
</html>
